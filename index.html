<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EBED">
<title>Task Sweeper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<div class="top"><h1>Task Sweeper</h1><button class="add" id="ad" aria-label="Nueva tarea" aria-expanded="false">+</button></div>

<form id="f">
 <div class="card">
  <div class="f"><label for="n">Tarea</label><input type="text" id="n" required maxlength="60" placeholder="Cortar el césped"></div>
  <div class="f"><label for="d">Primera vez</label><input type="date" id="d" required></div>
  <div class="f"><label for="u">Se repite</label>
   <select id="u"><option value="none">Nunca</option><option value="days">Cada X días</option><option value="weeks" selected>Cada X semanas</option><option value="months">Cada X meses</option></select></div>
  <div class="f" id="iw"><label for="i">Cada (X)</label><input type="number" id="i" min="1" max="52" value="2"></div>
 </div>
 <p class="hint" id="h"></p>
 <button class="save" type="submit">Agregar tarea</button>
</form>

<div class="seg" role="group" aria-label="Vista">
 <button type="button" id="vl" aria-pressed="true">Próximos días</button>
 <button type="button" id="vc" aria-pressed="false">Calendario</button>
</div>

<section id="list"></section>
<section id="cal" hidden>
 <div class="bar"><h2 id="mt"></h2><div class="nav"><button id="pv" aria-label="Mes anterior">‹</button><button id="td">Hoy</button><button id="nx" aria-label="Mes siguiente">›</button></div></div>
 <div class="grid" id="g"></div>
</section>

<div class="sec">Mis tareas</div>
<div class="card" id="ls"></div>
</main>

<script src="script.js"></script>
</body>
</html>
